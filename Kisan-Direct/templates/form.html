{% extends 'base.html' %}{% block content %}
<div class="card" style="max-width:480px"><h2>{{ title }}</h2>
<form method="post">{% csrf_token %}
{% for f in form %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
{% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}{% endfor %}
{% for e in form.non_field_errors %}<div class="err">{{ e }}</div>{% endfor %}
<p><button class="btn">{{ button }}</button></p></form></div>{% endblock %}
